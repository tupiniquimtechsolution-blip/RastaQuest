name: Web Preview

on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/production/room_blockouts/ROOM_BLOCKOUTS_V1.json'
      - '.github/workflows/web-preview.yml'
  push:
    paths:
      - 'web/**'
      - 'docs/production/room_blockouts/ROOM_BLOCKOUTS_V1.json'
      - '.github/workflows/web-preview.yml'

jobs:
  web-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check web/sw.js
          node --check web/pwa.test.mjs
          node --check web/build-standalone.mjs
          node --check web/standalone.test.mjs
          node --check web/loot.mjs
          node --check web/loot.test.mjs
          node --check web/loot-integration.test.mjs
          node --check web/run-save.mjs
          node --check web/run-save.test.mjs
          node --check web/geometry.test.mjs
          node --check web/progression.mjs
          node --check web/progression.test.mjs
          node --check web/engine.mjs
          node --check web/renderer.mjs
          node --check web/main.mjs
          node --check web/serve.mjs
          node --check web/verify.mjs
      - name: Verify room data and assets
        run: node web/verify.mjs
      - name: Test gameplay rules
        run: node --test web/engine.test.mjs web/progression.test.mjs web/pwa.test.mjs web/run-save.test.mjs web/geometry.test.mjs web/loot.test.mjs web/loot-integration.test.mjs

      - name: Build self-contained offline HTML
        run: node web/build-standalone.mjs
      - name: Verify standalone HTML bundle
        run: node --test web/standalone.test.mjs

      - name: Package browser preview for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: rasta-quest-web-preview
          path: web/
          if-no-files-found: error
          retention-days: 14

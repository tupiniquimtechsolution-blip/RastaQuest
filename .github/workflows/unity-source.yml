name: Unity Source Contracts (not Editor or APK)

on:
  pull_request:
    paths: ["unity/**", "tools/sync_unity_review.py", "tools/check_unity_source_contracts.py", "tools/validate_unity_art_contract.py", "tools/test_validate_unity_art_contract.py", "assets/production_drafts/2026-10-24/unity-illustrated-production/**", ".github/workflows/unity-source.yml"]
  push:
    branches: [main]
    paths: ["unity/**", "tools/sync_unity_review.py", "tools/check_unity_source_contracts.py", "tools/validate_unity_art_contract.py", "tools/test_validate_unity_art_contract.py", "assets/production_drafts/2026-10-24/unity-illustrated-production/**", ".github/workflows/unity-source.yml"]

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify copied review assets
        run: python -B tools/sync_unity_review.py --check
      - name: Audit bridge and source-only release boundaries
        run: python -B tools/check_unity_source_contracts.py
      - name: Validate illustrated art specification (not images)
        run: |
          python -B tools/validate_unity_art_contract.py
          python -B -m unittest discover -s tools -p test_validate_unity_art_contract.py -v
      - name: Compile and execute independent C# rules
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $binary = Join-Path $env:RUNNER_TEMP 'rasta-quest-unity-core-tests.exe'
          & $compiler /nologo "/out:$binary" 'unity\Assets\RastaQuest\Core\CombatRules.cs' 'unity\Assets\RastaQuest\Core\JumpRules.cs' 'unity\Tests\RulesTests.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: State verification boundary
        run: Write-Output 'Core rules and unchanged asset bytes only. Unity Editor, rendering, Android build and physical acceptance remain separate gates.'
